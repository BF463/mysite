<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 - 游戏合集</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#181818;color:#eee;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;gap:16px;user-select:none;
  }
  .top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;}
  .score-box{background:#242424;border:1px solid #333;border-radius:10px;padding:8px 18px;text-align:center;}
  .score-box .label{font-size:11px;color:#888;}
  .score-box .val{font-size:20px;font-weight:600;color:#ffaa55;}
  .board-wrap{position:relative;}
  canvas{
    background:#1c1c1c;border-radius:12px;touch-action:none;display:block;
    max-width:100%;
  }
  .overlay{
    position:absolute;inset:0;border-radius:12px;
    background:rgba(0,0,0,0.72);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .overlay.show{display:flex;}
  .overlay .msg{font-size:24px;font-weight:600;color:#fff;}
  button{
    font-family:inherit;font-size:15px;padding:10px 24px;border-radius:10px;
    border:1px solid #444;background:#242424;color:#eee;cursor:pointer;
  }
  button:active{background:#333;}
  button.primary{border-color:#ff6622;color:#ffaa55;}
  .controls{display:flex;gap:12px;}
  .hint{font-size:12px;color:#666;text-align:center;}
  a.back{text-decoration:none;color:#666;font-size:13px;padding:6px;}
</style>
</head>
<body>

  <div class="top">
    <div class="score-box"><div class="label">分数</div><div class="val" id="score">0</div></div>
    <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="msg" id="ovMsg">游戏结束</div>
      <button class="primary" id="ovBtn">再来一局</button>
    </div>
  </div>

  <div class="controls">
    <button id="newGame">新游戏</button>
  </div>

  <div class="hint">滑动屏幕 / 方向键 移动方块</div>
  <a class="back" href="games.html">← 返回合集</a>

<script>
(function(){
  "use strict";
  const N = 4;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovMsg = document.getElementById('ovMsg');
  const ovBtn = document.getElementById('ovBtn');

  let cell, gap, pad, size;
  function fit(){
    size = Math.min(window.innerWidth - 48, 420, window.innerHeight * 0.52);
    pad = Math.round(size * 0.025);
    gap = Math.round(size * 0.025);
    cell = Math.floor((size - pad*2 - gap*(N-1)) / N);
    // 回算实际尺寸
    size = cell*N + gap*(N-1) + pad*2;
    cv.width = size; cv.height = size;
    cv.style.width = size+'px'; cv.style.height = size+'px';
    draw();
  }
  window.addEventListener('resize', fit);

  let grid, score, won, over, animating;
  let best = Number(localStorage.getItem('g2048_best') || 0);
  bestEl.textContent = best;

  const COLORS = {
    0:'#2a2a2a', 2:'#3a3a3a', 4:'#4a4438',
    8:'#e8a13a', 16:'#e8873a', 32:'#e8663a', 64:'#e8443a',
    128:'#d4b83a', 256:'#d4a83a', 512:'#d4983a', 1024:'#d4883a', 2048:'#ffd700'
  };
  const TEXT = {
    2:'#aaa',4:'#ddd'
  };

  function init(){
    grid = Array.from({length:N}, ()=>Array(N).fill(0));
    score = 0; won = false; over = false;
    overlay.classList.remove('show');
    scoreEl.textContent = 0;
    addTile(); addTile();
    draw();
  }

  function emptyCells(){
    const arr = [];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(grid[r][c]===0) arr.push([r,c]);
    return arr;
  }

  function addTile(){
    const cells = emptyCells();
    if(!cells.length) return;
    const [r,c] = cells[Math.floor(Math.random()*cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function draw(){
    ctx.fillStyle = '#1c1c1c';
    ctx.fillRect(0,0,size,size);
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        const x = pad + c*(cell+gap);
        const y = pad + r*(cell+gap);
        const v = grid[r][c];
        ctx.fillStyle = COLORS[v] || '#ffd700';
        roundRect(x,y,cell,cell,Math.round(cell*0.12));
        if(v>0){
          ctx.fillStyle = (TEXT[v]||'#1a1a1a');
          const fs = v>=1024 ? cell*0.32 : v>=128 ? cell*0.36 : cell*0.42;
          ctx.font = 'bold ' + Math.floor(fs) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(v), x+cell/2, y+cell/2+1);
        }
      }
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
  }

  // 合并一行（向左），返回 [新行, 得分, 是否变化]
  function slideRow(row){
    const arr = row.filter(v=>v!==0);
    let gained = 0;
    for(let i=0;i<arr.length-1;i++){
      if(arr[i]===arr[i+1]){ arr[i]*=2; gained += arr[i]; arr.splice(i+1,1); }
    }
    while(arr.length < N) arr.push(0);
    return [arr, gained];
  }

  function move(dir){ // 0上 1右 2下 3左
    if(over) return;
    const before = JSON.stringify(grid);
    let gained = 0;

    const transpose = g => g[0].map((_,c)=>g.map(r=>r[c]));
    const reverse = g => g.map(r=>[...r].reverse());

    let g = grid;
    if(dir===0) g = transpose(grid);          // 上
    else if(dir===1) g = reverse(grid);       // 右
    else if(dir===2) g = reverse(transpose(grid)); // 下
    // dir 3 左 直接

    g = g.map(row=>{
      const [nr, gn] = slideRow(row);
      gained += gn;
      return nr;
    });

    if(dir===0) g = transpose(g);
    else if(dir===1) g = reverse(g);
    else if(dir===2) g = transpose(reverse(g));

    grid = g;

    if(JSON.stringify(grid) === before) return; // 无变化

    score += gained;
    scoreEl.textContent = score;
    addTile();
    draw();

    // 胜利检测
    if(!won && grid.some(r=>r.includes(2048))){
      won = true;
      ovMsg.textContent = '🎉 达成 2048！';
      ovBtn.textContent = '继续玩';
      overlay.classList.add('show');
    }else if(isGameOver()){
      over = true;
      ovMsg.textContent = '游戏结束';
      ovBtn.textContent = '再来一局';
      overlay.classList.add('show');
      if(score > best){ best = score; localStorage.setItem('g2048_best', best); bestEl.textContent = best; }
    }
  }

  function isGameOver(){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(grid[r][c]===0) return false;
      if(c<N-1 && grid[r][c]===grid[r][c+1]) return false;
      if(r<N-1 && grid[r][c]===grid[r+1][c]) return false;
    }
    return true;
  }

  // 键盘
  document.addEventListener('keydown', e=>{
    const k = e.key;
    if(k==='ArrowUp'||k==='w'||k==='W'){ move(0); e.preventDefault(); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ move(1); e.preventDefault(); }
    else if(k==='ArrowDown'||k==='s'||k==='S'){ move(2); e.preventDefault(); }
    else if(k==='ArrowLeft'||k==='a'||k==='A'){ move(3); e.preventDefault(); }
  });

  // 滑动
  let sx=0, sy=0, locked=false;
  cv.addEventListener('touchstart', e=>{
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; locked = false;
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', e=>{
    if(locked) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    locked = true;
    if(Math.abs(dx) > Math.abs(dy)) move(dx>0?1:3);
    else move(dy>0?2:0);
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchend', e=>e.preventDefault(), {passive:false});

  ovBtn.addEventListener('click', ()=>{
    if(over || !won){
      overlay.classList.remove('show'); init();
    }else{
      // 继续玩
      overlay.classList.remove('show');
    }
  });
  document.getElementById('newGame').addEventListener('click', init);

  init();
  fit();
})();
</script>
</body>
</html>
